<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>TSI Math Bootcamp</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,600..900&family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400;1,700&display=swap">
<style>
/* Layout: a test-prep notebook. Sticky module bar on top, one reading column on graph paper,
   bubble-sheet answer choices, highlighter for the one thing that matters (950). */
:root {
  --paper: #F3F6F9; --surface: #FFFFFF; --ink: #142039; --ink-soft: #46566F; --muted: #67758C;
  --line: #D2DCE6; --grid: #E3EAF1; --grid-strong: #CCD8E4;
  --blue: #2346C9; --on-blue: #FFFFFF; --blue-soft: #E6ECFC; --violet: #8B3DB9;
  --hi: #FFE14A; --hi-soft: #FFF1A6;
  --ok: #137A42; --ok-soft: #DDF2E5; --bad: #C1302B; --bad-soft: #FBE4E2;
  --shadow: rgba(20, 32, 57, .16);
  --f-display: 'Archivo', 'Arial Narrow', 'Helvetica Neue', Arial, sans-serif;
  --f-body: 'Atkinson Hyperlegible', system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif;
}
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) {
  --paper: #0D1424; --surface: #151F35; --ink: #E7ECF5; --ink-soft: #B6C1D4; --muted: #8E9BB2;
  --line: #2A3651; --grid: #19243B; --grid-strong: #26334E;
  --blue: #8EA9FF; --on-blue: #0D1424; --blue-soft: #1C2A4C; --violet: #D2A4FF;
  --hi: #F0CF45; --hi-soft: rgba(240, 207, 69, .22);
  --ok: #55CB8E; --ok-soft: rgba(85, 203, 142, .14); --bad: #FF8A82; --bad-soft: rgba(255, 138, 130, .14);
  --shadow: rgba(0, 0, 0, .45); color-scheme: dark; } }
:root[data-theme="dark"] {
  --paper: #0D1424; --surface: #151F35; --ink: #E7ECF5; --ink-soft: #B6C1D4; --muted: #8E9BB2;
  --line: #2A3651; --grid: #19243B; --grid-strong: #26334E;
  --blue: #8EA9FF; --on-blue: #0D1424; --blue-soft: #1C2A4C; --violet: #D2A4FF;
  --hi: #F0CF45; --hi-soft: rgba(240, 207, 69, .22);
  --ok: #55CB8E; --ok-soft: rgba(85, 203, 142, .14); --bad: #FF8A82; --bad-soft: rgba(255, 138, 130, .14);
  --shadow: rgba(0, 0, 0, .45); color-scheme: dark; }

[hidden] { display: none !important; }
html { font-size: 100%; }
html.big { font-size: 125%; }
body { margin: 0; background: var(--paper); color: var(--ink); font-family: var(--f-body); font-size: 1.0625rem; line-height: 1.55; -webkit-font-smoothing: antialiased; text-rendering: optimizeLegibility; }
* { box-sizing: border-box; }
button { font: inherit; color: inherit; }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; border-radius: 6px; }
.wrap { max-width: 52rem; margin: 0 auto; padding-inline: 1rem; }
@media (min-width: 720px) { .wrap { padding-inline: 1.5rem; } }
h1, h2, h3 { text-wrap: balance; }
p { margin: 0 0 .75rem; }
.eyebrow { font-family: var(--f-display); font-weight: 700; font-size: .78rem; letter-spacing: .09em; text-transform: uppercase; color: var(--muted); margin: 0 0 .5rem; }
.fine { font-size: .92rem; color: var(--ink-soft); }
.center { text-align: center; }

/* top bar */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 10; background: var(--paper); background: color-mix(in srgb, var(--paper) 90%, transparent); -webkit-backdrop-filter: blur(10px); backdrop-filter: blur(10px); border-bottom: 1px solid var(--line); }
.top-in { display: flex; align-items: center; gap: .75rem; min-height: 3.4rem; }
.brand { font-family: var(--f-display); font-weight: 800; font-stretch: 112%; font-size: 1.05rem; background: none; border: 0; padding: .3rem 0; cursor: pointer; white-space: nowrap; }
.brand span { background: linear-gradient(transparent 55%, var(--hi-soft) 55% 90%, transparent 90%); }
.tabs { display: flex; gap: .2rem; overflow-x: auto; flex: 1; min-width: 0; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab { white-space: nowrap; background: none; border: 0; border-radius: 999px; padding: .45rem .75rem; color: var(--ink-soft); font-weight: 700; font-size: .9rem; cursor: pointer; }
.tab:hover { background: var(--grid); color: var(--ink); }
.tab .n { font-family: var(--f-display); font-weight: 800; margin-right: .35rem; color: var(--muted); }
.tab[aria-current="page"] { background: var(--ink); color: var(--paper); }
.tab[aria-current="page"] .n { color: var(--hi); }
.bigbtn { flex: none; border: 1.5px solid var(--line); background: var(--surface); border-radius: 999px; font-family: var(--f-display); font-weight: 800; font-size: .85rem; padding: .35rem .65rem; cursor: pointer; }
.bigbtn[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
@media (max-width: 640px) { .brand { display: none; } }

/* buttons */
.btn { display: inline-flex; align-items: center; gap: .55rem; justify-content: center; font-weight: 700; font-size: 1rem; line-height: 1.1; padding: .78rem 1.2rem; min-height: 2.9rem; border-radius: 999px; border: 1.5px solid transparent; cursor: pointer; text-align: center; transition: transform .08s ease, background-color .15s ease; }
.btn:active:not(:disabled) { transform: translateY(1px); }
.btn.primary { background: var(--blue); color: var(--on-blue); }
.btn.primary:hover:not(:disabled) { filter: brightness(1.08); }
.btn.ghost { background: transparent; border-color: var(--line); color: var(--ink); }
.btn.ghost:hover:not(:disabled) { border-color: var(--ink-soft); }
.btn:disabled { opacity: .45; cursor: default; }
.btn.sm { min-height: 2.4rem; padding: .55rem .95rem; font-size: .92rem; }
.btn .cnt { font-weight: 400; opacity: .85; font-size: .82em; font-variant-numeric: tabular-nums; padding-left: .55rem; border-left: 1px solid currentColor; }
.linkbtn { background: none; border: 0; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; cursor: pointer; font-size: .9rem; padding: .5rem; }

/* math */
.m { white-space: nowrap; font-variant-numeric: lining-nums; }
.m i { font-style: italic; padding-right: .05em; }
.m sup { font-size: .68em; line-height: 0; position: relative; top: -.1em; }
.fr { display: inline-flex; flex-direction: column; vertical-align: middle; text-align: center; font-size: .86em; line-height: 1.15; margin: 0 .12em; }
.fr .nu { border-bottom: .09em solid currentColor; padding: 0 .2em .05em; }
.fr .de { padding: .05em .2em 0; }
.tick { color: var(--ok); font-weight: 700; }

/* home */
.hero { position: relative; margin-block: 1.5rem 2.25rem; padding: clamp(1.25rem, 5vw, 2.75rem); border: 1px solid var(--line); border-radius: 16px; background-color: var(--surface); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 24px 24px; background-position: -1px -1px; }
.hero h1 { position: relative; z-index: 0; isolation: isolate; font-family: var(--f-display); font-weight: 900; font-stretch: 115%; font-size: clamp(3rem, 11vw, 6rem); line-height: .92; letter-spacing: -.015em; margin: .2rem 0 1.1rem; }
.score { position: relative; display: inline-block; padding: 0 .06em; font-variant-numeric: lining-nums; }
.score::before { content: ""; position: absolute; z-index: -1; left: -.05em; right: -.05em; bottom: .04em; height: .44em; background: var(--hi); border-radius: .06em .14em .08em .12em; transform: rotate(-1.6deg) skewX(-10deg); }
:root[data-theme="dark"] .score::before { opacity: .9; }
.lede { font-size: 1.15rem; max-width: 36rem; color: var(--ink-soft); }
.hero-row { display: flex; flex-wrap: wrap; align-items: center; gap: 1rem 1.5rem; margin-top: 1.25rem; }
.meter { display: flex; flex-wrap: wrap; align-items: center; gap: .55rem; }
.meter-t { font-size: .92rem; color: var(--ink-soft); }
.sq { display: inline-flex; gap: 3px; vertical-align: middle; }
.sq i { width: .7rem; height: .7rem; border-radius: 2px; border: 1.5px solid var(--grid-strong); background: var(--surface); }
.sq i.on { background: var(--ok); border-color: var(--ok); }
.block { margin-block: 2.25rem; }
.block h2 { font-family: var(--f-display); font-weight: 800; font-stretch: 108%; font-size: 1.45rem; margin: 0 0 .9rem; }
.facts { list-style: none; margin: 0 0 .75rem; padding: 0; display: grid; grid-template-columns: repeat(auto-fit, minmax(10.5rem, 1fr)); border: 1px solid var(--line); border-radius: 14px; background: var(--surface); overflow: hidden; }
.facts li { padding: 1rem 1.1rem; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); margin: 0 -1px -1px 0; }
.facts b { display: block; font-family: var(--f-display); font-weight: 800; font-stretch: 110%; font-size: 1.35rem; line-height: 1.1; margin-bottom: .3rem; }
.facts span { font-size: .95rem; color: var(--ink-soft); }
.agenda { list-style: none; margin: 0; padding: 0; border-top: 1px solid var(--line); }
.agenda li { display: grid; grid-template-columns: 3.4rem minmax(0, 1fr) auto; gap: .9rem; align-items: center; padding: .85rem 0; border-bottom: 1px solid var(--line); }
.agenda .at { font-family: var(--f-display); font-weight: 800; font-variant-numeric: tabular-nums; color: var(--muted); }
.ag-main { min-width: 0; display: grid; gap: .1rem; }
.ag-title { justify-self: start; background: none; border: 0; padding: 0; text-align: left; font-weight: 700; font-size: 1.08rem; cursor: pointer; text-decoration: underline; text-decoration-color: var(--grid-strong); text-underline-offset: 4px; }
.ag-title:hover { text-decoration-color: var(--blue); }
.ag-title.plain { text-decoration: none; cursor: default; }
.ag-n { font-family: var(--f-display); font-weight: 800; margin-right: .45rem; color: var(--blue); }
.ag-note { font-size: .92rem; color: var(--ink-soft); }
.agenda li.brk .ag-title, .agenda li.end .ag-title { color: var(--muted); }
.habits { display: grid; gap: .9rem; grid-template-columns: repeat(auto-fit, minmax(17rem, 1fr)); }
.habit { display: flex; gap: .85rem; padding: 1rem 1.1rem; border-radius: 12px; background: var(--surface); border: 1px solid var(--line); }
.habit h3 { margin: 0 0 .25rem; font-size: 1.05rem; }
.habit p { margin: 0; color: var(--ink-soft); font-size: .97rem; }
.hn { flex: none; font-family: var(--f-display); font-weight: 900; font-size: 1.6rem; line-height: 1; color: var(--blue); width: 1.4rem; }
.teacher { border: 1px dashed var(--grid-strong); border-radius: 12px; padding: .9rem 1.1rem; }
.teacher summary { cursor: pointer; font-weight: 700; }
.teacher ul { margin: .75rem 0 0; padding-left: 1.2rem; display: grid; gap: .45rem; color: var(--ink-soft); }
.reset { text-align: center; margin-block: 1rem 3rem; display: grid; justify-items: center; gap: .5rem; }
.reset p { margin: 0; }
.reset-row { display: flex; flex-wrap: wrap; gap: .5rem; justify-content: center; }
.erased { color: var(--ok); font-weight: 700; }

/* module pages */
.mod-head { padding-block: 1.75rem .5rem; }
.mod-head h1 { font-family: var(--f-display); font-weight: 900; font-stretch: 112%; font-size: clamp(2rem, 7vw, 3.2rem); line-height: 1; margin: 0 0 .8rem; letter-spacing: -.01em; }
.why { font-size: 1.1rem; color: var(--ink-soft); max-width: 40rem; }
.seg { display: inline-flex; gap: 4px; padding: 4px; border-radius: 999px; background: var(--surface); border: 1.5px solid var(--line); margin-top: .5rem; }
.seg button { display: inline-flex; align-items: center; gap: .55rem; border: 0; background: none; border-radius: 999px; padding: .55rem 1.1rem; font-weight: 700; cursor: pointer; color: var(--ink-soft); }
.seg button[aria-selected="true"] { background: var(--ink); color: var(--paper); }
.seg button[aria-selected="true"] .sq i:not(.on) { background: transparent; border-color: color-mix(in srgb, var(--paper) 45%, transparent); }
.mod-body { padding-block: 1rem 3rem; }
.move { display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 0 1rem; padding-block: 1.75rem; border-top: 1px solid var(--line); }
.move:first-child { border-top: 0; }
.move-n { width: 2.3rem; height: 2.3rem; border-radius: 50%; display: grid; place-items: center; background: var(--ink); color: var(--paper); font-family: var(--f-display); font-weight: 800; font-size: 1.1rem; }
.move-body { min-width: 0; }
.move h2 { font-family: var(--f-display); font-weight: 800; font-stretch: 106%; font-size: 1.5rem; line-height: 1.15; margin: .2rem 0 .5rem; }
.rule { font-size: 1.08rem; max-width: 40rem; }
@media (max-width: 520px) { .move { grid-template-columns: minmax(0, 1fr); } .move-n { margin-bottom: .5rem; width: 2rem; height: 2rem; font-size: 1rem; } }
.ex { background: var(--surface); border: 1px solid var(--line); border-radius: 12px; padding: 1rem 1.1rem; margin-block: .9rem; }
.ex-q { font-size: 1.1rem; font-weight: 700; margin-bottom: .25rem; }
.tag { display: inline-block; font-family: var(--f-display); font-weight: 800; font-size: .7rem; letter-spacing: .09em; text-transform: uppercase; color: var(--blue); background: var(--blue-soft); border-radius: 4px; padding: .15rem .4rem; vertical-align: .15em; margin: 0 .35rem .25rem 0; }
.steps { list-style: none; counter-reset: st; margin: .6rem 0 0; padding: 0; display: grid; gap: .55rem; }
.steps li { counter-increment: st; display: grid; grid-template-columns: 1.6rem minmax(0, 1fr); column-gap: .6rem; }
.steps li::before { content: counter(st); grid-row: span 2; width: 1.6rem; height: 1.6rem; border-radius: 50%; border: 1.5px solid var(--grid-strong); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: .8rem; color: var(--muted); }
.say { grid-column: 2; }
.sm { grid-column: 2; display: block; font-size: 1.22rem; margin-top: .15rem; overflow-x: auto; padding-bottom: .1rem; }
.steps span.sm > .m { white-space: normal; }
.ex-ctrl { display: flex; flex-wrap: wrap; gap: .5rem; margin-top: .9rem; }
.watch { margin-top: 1rem; max-width: 40rem; }
.pen { font-family: var(--f-display); font-weight: 800; font-size: .74rem; letter-spacing: .09em; text-transform: uppercase; color: var(--bad); margin-right: .35rem; border-bottom: 2px solid var(--bad); }
.tblwrap { overflow-x: auto; margin-block: .75rem 1rem; }
.words { border-collapse: collapse; min-width: 18rem; background: var(--surface); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; }
.words th, .words td { padding: .5rem .85rem; border-bottom: 1px solid var(--line); text-align: left; }
.words th { font-size: .8rem; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); background: var(--paper); }
.words tr:last-child td { border-bottom: 0; }
.words .sym { font-size: 1.35rem; font-weight: 700; text-align: center; color: var(--blue); }
.xy { border-collapse: collapse; margin-inline: auto; font-size: 1.15rem; font-variant-numeric: tabular-nums; background: var(--surface); }
.xy th, .xy td { border: 1px solid var(--grid-strong); padding: .45rem .95rem; text-align: center; }
.xy th { background: var(--paper); }
.figrow { display: flex; flex-wrap: wrap; align-items: center; gap: .5rem 1.25rem; margin-block: .5rem; }
.figrow .plot { margin: 0; max-width: 16rem; }
.figcap { flex: 1; min-width: 12rem; margin: 0; line-height: 1.9; }
.key { display: inline-block; width: 1.4rem; height: 3px; border-radius: 2px; vertical-align: middle; margin-right: .5rem; background: var(--blue); }
.key.k2 { background: var(--violet); }
.shift { display: grid; grid-template-columns: minmax(0, 17rem) minmax(0, 1fr); gap: 1rem 1.5rem; align-items: center; margin-block: .75rem 1rem; padding: 1rem; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.shift .plot { margin: 0; }
.shift-ctl { display: grid; gap: .35rem; min-width: 0; }
.shift-eq { font-size: 1.55rem; margin-bottom: .4rem; }
.shift-ctl input[type="range"] { width: 100%; accent-color: var(--blue); margin-bottom: .5rem; }
@media (max-width: 600px) { .shift { grid-template-columns: minmax(0, 1fr); } .shift .plot { max-width: 17rem; margin-inline: auto; } }
.tip { margin-top: 1.5rem; padding: 1.1rem 1.25rem; border-radius: 12px; background: var(--hi-soft); }
.tip-h { font-family: var(--f-display); font-weight: 800; font-size: .78rem; letter-spacing: .09em; text-transform: uppercase; margin-bottom: .3rem; }
.tip p:last-child { margin: 0; }
.next-row { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: .75rem; margin-top: 1.5rem; }
.next-row.start { justify-content: flex-start; }

/* practice */
.chips { display: flex; flex-wrap: wrap; gap: .5rem; margin: .75rem 0 .5rem; }
.chip { display: inline-flex; align-items: center; gap: .55rem; padding: .5rem .85rem; border-radius: 999px; border: 1.5px solid var(--line); background: var(--surface); font-weight: 700; font-size: .92rem; cursor: pointer; }
.chip:hover { border-color: var(--ink-soft); }
.chip[aria-pressed="true"] { border-color: var(--ink); background: var(--blue-soft); }
.dots { display: inline-flex; gap: 3px; }
.dots i { width: .5rem; height: .5rem; border-radius: 50%; border: 1.5px solid var(--grid-strong); }
.dots i.on { background: var(--ink); border-color: var(--ink); }
.dots.done { color: var(--ok); font-weight: 800; }
.streak { margin: .5rem 0 1rem; color: var(--ink-soft); }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: clamp(1rem, 4vw, 1.75rem); box-shadow: 0 14px 34px -22px var(--shadow); }
.q { font-size: 1.2rem; line-height: 1.5; margin-bottom: 1rem; }
.quote { font-size: 1.15rem; line-height: 1.5; padding: .8rem 1rem; margin: 0 0 .8rem; background: var(--paper); border-radius: 10px; }
.quote::before { content: "“"; font-family: var(--f-display); font-weight: 900; color: var(--blue); margin-right: .15rem; }
.quote::after { content: "”"; font-family: var(--f-display); font-weight: 900; color: var(--blue); margin-left: .1rem; }
.big { display: grid; gap: .4rem; justify-items: center; font-size: clamp(1.35rem, 5vw, 1.8rem); padding: 1rem; margin: 0 0 1.1rem; border-radius: 12px; background-color: var(--paper); background-image: linear-gradient(var(--grid) 1px, transparent 1px), linear-gradient(90deg, var(--grid) 1px, transparent 1px); background-size: 18px 18px; overflow-x: auto; }
.plot { display: block; width: 100%; max-width: 20rem; height: auto; margin: 0 auto 1.1rem; }
.plot .bg { fill: var(--surface); }
.plot .gl { stroke: var(--grid-strong); stroke-width: 1; }
.plot .gl.ax { stroke: var(--ink-soft); stroke-width: 1.7; }
.plot .tk { fill: var(--muted); font: 700 11px var(--f-body); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }
.plot .axl { fill: var(--ink-soft); font: italic 700 14px var(--f-body); paint-order: stroke; stroke: var(--surface); stroke-width: 3px; }
.plot .cv { fill: none; stroke: var(--blue); stroke-width: 3; stroke-linecap: round; stroke-linejoin: round; }
.plot .cv.alt { stroke: var(--violet); }
.plot .cv.parent { stroke: var(--muted); stroke-dasharray: 5 6; stroke-width: 2; }
.plot .pt { fill: var(--ink); stroke: var(--surface); stroke-width: 2; }
.plot .ptl { fill: var(--ink); font: 700 13px var(--f-body); paint-order: stroke; stroke: var(--surface); stroke-width: 4px; }
.choices { display: grid; gap: .6rem; grid-template-columns: minmax(0, 1fr); }
@media (min-width: 620px) { .choices { grid-template-columns: repeat(2, minmax(0, 1fr)); } .choices.one { grid-template-columns: minmax(0, 1fr); } }
.choice { display: flex; align-items: center; gap: .8rem; width: 100%; min-height: 3.4rem; text-align: left; padding: .65rem .9rem; border: 1.5px solid var(--line); border-radius: 12px; background: var(--surface); font-size: 1.15rem; cursor: pointer; transition: border-color .12s ease, background-color .12s ease; }
.choice:hover:not(:disabled) { border-color: var(--ink-soft); }
.choice .bub { flex: none; width: 2rem; height: 2rem; border-radius: 50%; border: 1.5px solid var(--ink-soft); display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: .88rem; transition: background-color .12s ease; }
.choice .ct { min-width: 0; overflow-x: auto; padding-block: .1rem; }
.choice[aria-pressed="true"] { border-color: var(--ink); }
.choice[aria-pressed="true"] .bub { background: var(--ink); border-color: var(--ink); color: var(--surface); }
.choice:disabled { cursor: default; }
.choice.right { border-color: var(--ok); background: var(--ok-soft); }
.choice.right .bub { background: var(--ok); border-color: var(--ok); color: var(--surface); }
.choice.wrong { border-color: var(--bad); background: var(--bad-soft); }
.choice.wrong .bub { background: var(--bad); border-color: var(--bad); color: var(--surface); }
.choice.dim { opacity: .55; }
.actions { display: flex; flex-wrap: wrap; justify-content: flex-end; gap: .6rem; margin-top: 1.1rem; }
.hintbox { margin: 1rem 0 0; padding: .75rem 1rem; border-radius: 10px; background: var(--blue-soft); }
.fb { margin-top: 1.1rem; padding: .9rem 1.1rem; border-radius: 12px; }
.fb p:last-child { margin-bottom: 0; }
.fb.yes { background: var(--ok-soft); }
.fb.no { background: var(--bad-soft); }
.fb-h { font-weight: 700; font-size: 1.08rem; }
.fb.yes .fb-h { color: var(--ok); }
.fb.no .fb-h { color: var(--bad); }
.sol { margin-top: 1.1rem; padding-top: 1rem; border-top: 1px dashed var(--grid-strong); }
.results { list-style: none; margin: .5rem 0 1rem; padding: 0; border-top: 1px solid var(--line); }

    const fb = i => { const o = [[1, 0], [0, 1], [-1, 0], [0, -1], [1, 1], [2, 0], [0, 2], [-1, -1]][i]; if (!o) return null; const px = x0 + o[0], py = y0 + o[1]; return { m: P2(px, py), why: pairWhy(eqs, px, py) }; };
    const steps = [['Both equations equal y, so set the right sides equal to each other.', `${lin([[m1, 'x'], [b1, '']])} = ${lin([[m2, 'x'], [b2, '']])}`],
      [`${m2 > 0 ? 'Subtract' : 'Add'} \`${lin([[Math.abs(m2), 'x']])}\` ${m2 > 0 ? 'from' : 'to'} both sides.`, { t: 'bal', L: [[m1, 'x'], [b1, '']], R: [[m2, 'x'], [b2, '']], op: [-m2, 'x'] }]];
    if (b1 !== 0) steps.push([`${b1 > 0 ? 'Subtract' : 'Add'} ${Math.abs(b1)} on both sides.`, { t: 'bal', L: [[D, 'x'], [b1, '']], R: [[b2, '']], op: [-b1, ''] }]);
    if (D !== 1) steps.push([`Divide both sides by ${N(D)}.`, { t: 'bal', L: [[D, 'x']], R: [[b2 - b1, '']], div: D }]);
    steps.push([`Plug \`x = ${x0}\` into the first equation to find y.`, `y = ${linSub(m1, b1, x0)} = ${y0}`],
      [`The lines meet at \`${P2(x0, y0)}\`. Check it in the second equation: \`${linSub(m2, b2, x0)} = ${y0}\` ✓`, null]);
    return { q: 'At what point do these two lines intersect?', big: [e1, e2], choices: mc({ m: P2(x0, y0) }, cands, fb),
      hint: 'Both equations say “y = …”, so set the two right sides equal and solve for x. Then find y.', steps, spec: { type: 'pair', eqs: [e1, e2] } };

  if (r < 0.75) {

    const a1 = rint(1, 5); let a2; do { a2 = rint(1, 5); } while (!add && a2 === a1);
    const c1 = a1 * x0 + b1 * y0, c2 = a2 * x0 + b2 * y0, A = add ? a1 + a2 : a1 - a2, C = add ? c1 + c2 : c1 - c2;

      x0 !== 0 ? { m: P2(-x0, y0), why: W(-x0, y0, 'Recheck the sign of x.') } : null];
    const fb = i => { const o = [[1, 0], [0, 1], [-1, 0], [0, -1], [1, 1], [2, 0], [0, 2]][i]; if (!o) return null; const px = x0 + o[0], py = y0 + o[1]; return { m: P2(px, py), why: pairWhy(eqs, px, py) }; };
    const steps = [[add ? `Stack the equations and <b>add</b> them. The y-terms (\`${lin([[b1, 'y']])}\` and \`${lin([[b2, 'y']])}\`) are opposites, so they cancel.` : `Stack the equations and <b>subtract</b> every term of the second from the first. The y-terms (\`${lin([[b1, 'y']])}\`) match, so they cancel.`, { t: 'stack', e1: { L: [[a1, 'x'], [b1, 'y']], R: [[c1, '']] }, e2: { L: [[a2, 'x'], [b2, 'y']], R: [[c2, '']] }, op: add ? '+' : '-' }]];

      hint: add ? 'Look at the y-terms. They are opposites, so adding the equations cancels y.' : 'Look at the y-terms. They match, so subtracting one equation from the other cancels y.',

  const truth = `Solve the second equation for y and you get \`y = ${lin([[m2, 'x'], [b2, '']])}\`. ` +
    (kind === 'inf' ? 'That is the same line as the first one, so every point on it works.' : kind === 'none' ? 'Same slope, different y-intercept: the lines are parallel and never meet.' : 'The slopes are different, so the lines cross at exactly one point.');
  const cands = ['one', 'none', 'inf', 'two'].filter(c => c !== kind).map(c => ({ t: COUNT_TXT[c], why: (c === 'two' ? 'Two different straight lines can cross at most once. ' : '') + truth }));

    [`Divide every term by ${N(k)}.`, `y = ${lin([[m2, 'x'], [b2, '']])}`],
    [kind === 'inf' ? 'Same slope and same intercept as the first line. It is the same line: infinitely many solutions.' : kind === 'none' ? `Same slope (${N(m)}) but different intercepts (${N(b)} and ${N(b2)}). Parallel lines never cross: no solution.` : `Different slopes (${N(m)} and ${N(m2)}). The lines cross once: exactly one solution.`, null]];

    hint: 'Put both equations in `y = mx + b` form. Compare the slopes, then the intercepts.', steps, spec: { type: 'count', eqs: [e1, e2], answer: kind } };
}

function s2a() {
  const t = rint(1, 5), k = rint(2, 12), m = rint(2, 6);
  let sent, ans, ds, T, steps, hint;
  if (t === 1) {
    const lo = Math.ceil((k + 1) / m), n = rint(lo, lo + 10); T = m * n - k;
    sent = `${k} less than ${times(m)} a number is ${T}.`; ans = `${m}n - ${k} = ${T}`;
    ds = [[`${k} - ${m}n = ${T}`, `“Less than” flips the order. “${k} less than ${times(m)} a number” starts with \`${m}n\` and takes away ${k}.`],
      [`${m}(n - ${k}) = ${T}`, `The ${k} is subtracted <b>after</b> you multiply, so there are no parentheses.`],
      [`${m}n + ${k} = ${T}`, '“Less than” means subtract, not add.']];
    hint = `“Less than” flips the order: “${k} less than y” means \`y - ${k}\`.`;
    steps = [[`“${cap(times(m))} a number” is \`${m}n\`. “${k} less than” that is \`${m}n - ${k}\`. “Is” means =.`, ans], [`Bonus: solve it. Add ${k} to both sides.`, { t: 'bal', L: [[m, 'n'], [-k, '']], R: [[T, '']], op: [k, ''] }], [`Divide both sides by ${m}.`, { t: 'bal', L: [[m, 'n']], R: [[T + k, '']], div: m }]];
  } else if (t === 2) {
    const n = rint(1, 12); T = m * n + k;
    sent = `${k} more than ${times(m)} a number is ${T}.`; ans = `${m}n + ${k} = ${T}`;
    ds = [[`${m}(n + ${k}) = ${T}`, `The ${k} is added <b>after</b> you multiply, so there are no parentheses.`],
      [`${m}n - ${k} = ${T}`, '“More than” means add.'],
      k !== m && (T - m) / k !== n ? [`${k}n + ${m} = ${T}`, `The number is multiplied by ${m}, and then ${k} is added.`] : null,
      T - m - k !== n ? [`${m} + n + ${k} = ${T}`, `“${cap(times(m))}” means multiply.`] : null,
      [`${m}n = ${T} + ${k}`, `The ${k} belongs with \`${m}n\` on the left side. The sentence adds it to ${times(m)} the number.`]];
    hint = `Build it in order: first “${times(m)} a number,” then add ${k}.`;
    steps = [[`“${cap(times(m))} a number” is \`${m}n\`. “${k} more than” that is \`${m}n + ${k}\`. “Is” means =.`, ans], [`Bonus: solve it. Subtract ${k} from both sides.`, { t: 'bal', L: [[m, 'n'], [k, '']], R: [[T, '']], op: [-k, ''] }], [`Divide both sides by ${m}.`, { t: 'bal', L: [[m, 'n']], R: [[T - k, '']], div: m }]];
  } else if (t === 3) {
    const n = rint(1, 10); T = m * (n + k);
    sent = `${cap(times(m))} the sum of a number and ${k} is ${T}.`; ans = `${m}(n + ${k}) = ${T}`;
    ds = [[`${m}n + ${k} = ${T}`, `“The sum of a number and ${k}” has to be added first. Parentheses keep the sum together.`],
      [`${m}(n - ${k}) = ${T}`, '“Sum” means add.'],
      [`${m} + n + ${k} = ${T}`, `“${cap(times(m))}” means multiply.`]];
    hint = '“The sum of a number and …” is one group. Put it in parentheses before you multiply.';
    steps = [[`“The sum of a number and ${k}” is \`n + ${k}\`. ${cap(times(m))} that sum needs parentheses.`, ans], [`Bonus: solve it. Divide by ${m}, then subtract ${k}.`, `n = ${n}`]];
  } else if (t === 4) {
    T = rint(2, 9); const n = m * T + k;
    sent = `The difference of a number and ${k}, divided by ${m}, is ${T}.`; ans = `{n - ${k}/${m}} = ${T}`;
    ds = [[`n - {${k}/${m}} = ${T}`, `The whole difference gets divided by ${m}, so all of \`n - ${k}\` goes on top of the fraction.`],
      [`{${k} - n/${m}} = ${T}`, `“The difference of a number and ${k}” is \`n - ${k}\`, in that order.`],
      [`${m}(n - ${k}) = ${T}`, '“Divided by” means divide, not multiply.']];
    hint = `“The difference of a number and ${k}” is \`n - ${k}\`. The comma tells you the whole difference is divided.`;
    steps = [[`“The difference of a number and ${k}” is \`n - ${k}\`. Divide that whole group by ${m}.`, ans], [`Bonus: solve it. Multiply by ${m}, then add ${k}.`, `n = ${n}`]];
  } else {
    T = null;
    sent = `A number decreased by ${k} is equal to ${times(m)} the number.`; ans = `n - ${k} = ${m}n`;
    ds = [[`${k} - n = ${m}n`, `“A number decreased by ${k}” starts with the number: \`n - ${k}\`.`],
      [`n - ${k} = ${m} + n`, `“${cap(times(m))} the number” is a product: \`${m}n\`.`],
      [`n = ${m}n - ${k}`, `The ${k} is taken away from n on the <b>left</b> side.`]];
    hint = '“Decreased by” means subtract, and the number comes first. “Is equal to” is the equals sign.';
    steps = [[`Left side: “a number decreased by ${k}” is \`n - ${k}\`. Right side: “${times(m)} the number” is \`${m}n\`.`, ans]];
  }
  const cands = ds.filter(Boolean).map(([mm, why]) => ({ m: mm, why }));
  return { q: 'Let `n` be the number. Which equation matches this sentence?', quote: sent, big: [], choices: mc({ m: ans }, cands, () => null), hint, steps,
    spec: { type: 'translate', t, k, m, T } };
}

const MODELS = [
  { v: 'm', tot: 'C', unit: 'month', mk: () => { const f = pick([25, 30, 40, 50, 75]), r = pick([15, 20, 25, 30, 35]); return { f, r, s: `A gym charges a ${money(f)} sign-up fee plus ${money(r)} per month.`, a: 'Which equation gives the total cost `C`, in dollars, after `m` months?' }; } },

  { v: 'g', tot: 'C', unit: 'GB', mk: () => { const f = pick([30, 35, 40, 45]), r = pick([5, 8, 10, 12]); return { f, r, s: `A phone plan costs ${money(f)} per month plus ${money(r)} for each gigabyte (GB) of data used.`, a: 'Which equation gives the monthly bill `C` when `g` GB are used?' }; } },

  { v: 't', tot: 'C', unit: 'text', mk: () => { const f = pick([15, 20, 25]), r = pick([0.05, 0.1, 0.15, 0.25]); return { f, r, s: `A messaging plan costs ${money(f)} a month plus ${money(r)} per text.`, a: 'Which equation gives the monthly cost `C` for `t` texts?' }; } },
  { v: 't', tot: 'G', unit: 'minute', neg: true, mk: () => { const f = pick([300, 400, 500, 600]), r = pick([8, 10, 12, 15, 20]); return { f, r, s: `A tank holds ${f} gallons of water and drains at ${r} gallons per minute.`, a: 'Which equation gives the gallons `G` left after `t` minutes?' }; } }

function s2b() {
  const M = pick(MODELS), { f, r, s, a } = M.mk(), v = M.v, T = M.tot, u = M.unit;
  let ans, cands, steps, hint;
  if (!M.neg) {
    ans = `${T} = ${lin([[r, v], [f, '']])}`;
    cands = [{ m: `${T} = ${lin([[f, v], [r, '']])}`, why: `The ${money(f)} happens once, so it stands alone. The ${money(r)} happens every ${u}, so it gets multiplied by \`${v}\`.` },
      { m: `${T} = ${coefAbs(r, '')}(${v} + ${ns(f)})`, why: `The parentheses multiply the one-time ${money(f)} by \`${v}\` too. It should only be added once.` },
      { m: `${T} = ${lin([[r + f, v]])}`, why: `You can't combine a one-time amount and a per-${u} rate into one rate.` },
      { m: `${T} = ${lin([[r, v], [-f, '']])}`, why: `The ${money(f)} adds to the total, so it should be \`+ ${ns(f)}\`.` }];

  }

      choices: mc(W(n), cands, fb), hint: 'Write a cost equation for each gym, then set them equal.',
      steps: [['Gym A = Gym B. Write each total with m for months.', `${lin([[r1, 'm'], [f1, '']])} = ${lin([[r2v, 'm'], [f2, '']])}`],
        [`Subtract \`${r2v}m\` from both sides.`, { t: 'bal', L: [[r1, 'm'], [f1, '']], R: [[r2v, 'm'], [f2, '']], op: [-r2v, 'm'] }],
        f1 ? [`Subtract ${f1} from both sides.`, { t: 'bal', L: [[r1 - r2v, 'm'], [f1, '']], R: [[f2, '']], op: [-f1, ''] }] : null,

    <label for="sh-h">Left or right: <b id="sh-hd">${hDesc(h)}</b></label><input id="sh-h" type="range" min="-4" max="4" step="1" value="${h}" data-act="shift">
    <label for="sh-k">Down or up: <b id="sh-kd">${kDesc(k)}</b></label><input id="sh-k" type="range" min="-4" max="4" step="1" value="${k}" data-act="shift">
    <p class="fine">The dashed curve is the original, <span class="m"><i>y</i> = <i>x</i><sup>2</sup></span>. Slide right and watch the sign inside the parentheses turn negative.</p></div></div>`;
}
function learn(m) {
  let h = '';
  m.moves.forEach((mv, i) => {
    h += `<section class="move"><span class="move-n">${i + 1}</span><div class="move-body"><h2>${mv.t}</h2><p class="rule">${Rp(mv.rule)}</p>`;
    if (mv.words) h += `<div class="tblwrap"><table class="words"><thead><tr><th>When you read…</th><th>Write</th></tr></thead><tbody>${WORDS.map(([w, s]) => `<tr><td>${w}</td><td class="sym">${s}</td></tr>`).join('')}</tbody></table></div>`;
    if (mv.fig === 'system') h += `<div class="figrow">${plot({ xr: [-2, 7], yr: [-2, 9], curves: [{ f: x => 2 * x + 1 }, { f: x => -x + 7, cls: 'alt' }], pts: [{ x: 2, y: 5, label: '(2, 5)' }], aria: 'Two lines crossing at the point (2, 5)' })}<p class="figcap"><span class="key k1"></span><span class="m"><i>y</i> = 2<i>x</i> + 1</span><br><span class="key k2"></span><span class="m"><i>y</i> = −<i>x</i> + 7</span><br>They cross at one point, so the system has exactly one solution.</p></div>`;
    if (mv.fig === 'shift') h += shiftFig();
    if (mv.pieces) h += `<div class="pieces">${[['100%', 'the whole'], ['50%', 'half'], ['25%', 'half of half'], ['10%', 'decimal point 1 place left'], ['5%', 'half of 10%'], ['1%', 'decimal point 2 places left']].map(([p, d]) => `<span class="pc"><b>${p}</b><span>${d}</span></span>`).join('')}</div>`;
    if (mv.tpl) h += '<div class="pct-tpl"><span class="bf-lab l"><span>part</span><span>whole</span></span><span class="fr tpl-fr"><span class="nu">is</span><span class="de">of</span></span><span class="tpl-eq">=</span><span class="fr tpl-fr"><span class="nu">%</span><span class="de">100</span></span><span class="bf-lab r"><span>percent</span><span>always 100</span></span></div>';
    if (mv.rules) h += `<div class="tblwrap"><table class="words"><thead><tr><th>Equation</th><th>Graph of f moves…</th></tr></thead><tbody>${RULES.map(([e, d]) => `<tr><td>${Rm(e)}</td><td>${d}</td></tr>`).join('')}</tbody></table></div>`;
    mv.ex.forEach((ex, j) => { h += exampleHTML(`${m.n}-${i}-${j}`, ex); });
    h += `<p class="watch"><span class="pen">Watch out</span> ${Rp(mv.watch)}</p></div></section>`;
  });
  h += `<aside class="tip"><p class="tip-h">TSI tip</p><p>${Rp(m.tip)}</p></aside>
    <div class="next-row"><button class="btn primary" data-act="tab" data-tab="practice">Practice these four skills</button></div>`;
  return h;
}
function ensurePrac(n) {
  const m = MODS[n - 1];
  if (!S.prac[n]) S.prac[n] = { src: m.skills.find(s => !isDone(s)) || m.skills[0] };
  if (!S.prac[n].p) newProblem(S.prac[n], n);
  return S.prac[n];
}
function newProblem(P, n) {
  const sid = P.src === 'mix' ? MODS[n - 1].skills[Math.floor(Math.random() * 4)] : P.src;
  Object.assign(P, { p: E.generate(sid), sel: null, done: false, hint: false, steps: false });
}
function card(P, o) {
  const p = P.p;
  let h = `<article class="card prob"><p class="eyebrow">${o.label || E.SKILLS[p.skill].name}</p>`;
  if (p.quote) h += `<p class="quote">${Rp(p.quote)}</p>`;
  h += `<p class="q">${Rp(p.q)}</p>`;
  if (p.big && p.big.length) h += `<div class="big">${p.big.map(b => `<div>${Rm(b)}</div>`).join('')}</div>`;
  if (p.fig) h += figHTML(p.fig);
  const wide = p.choices.some(c => c.t !== undefined && c.t.length > 22);
  h += `<div class="choices${wide ? ' one' : ''}" role="group" aria-label="Answer choices">` + p.choices.map((c, i) => {
    let cls = ''; if (P.done) cls = c.ok ? ' right' : i === P.sel ? ' wrong' : ' dim';
    return `<button class="choice${cls}" data-act="pick" data-i="${i}" aria-pressed="${i === P.sel}"${P.done ? ' disabled' : ''}><span class="bub">${LET[i]}</span><span class="ct">${c.m !== undefined ? Rm(c.m) : Rp(c.t)}</span></button>`;
  }).join('') + '</div>';
  if (!P.done) {
    if (P.hint) h += `<p class="hintbox"><b>Hint.</b> ${Rp(p.hint)}</p>`;
    h += `<div class="actions"><button class="btn ghost" data-act="hint"${P.hint ? ' disabled' : ''}>${P.hint ? 'Hint is showing' : 'Show a hint'}</button><button class="btn primary" data-act="check"${P.sel === null ? ' disabled' : ''}>Check answer</button></div>`;
  } else {
    const c = p.choices[P.sel], key = p.choices.findIndex(x => x.ok);
    h += `<div class="fb ${c.ok ? 'yes' : 'no'}" role="status"><p class="fb-h">${c.ok ? '✓ Correct' : `✗ Not quite. The answer is ${LET[key]}.`}</p>${c.ok ? '' : `<p>${Rp(c.why)}</p>`}${c.ok && P.hint ? '<p class="fine">Hints don’t count toward the three-in-a-row streak, so try the next one without it.</p>' : ''}</div>`;
    h += `<div class="actions"><button class="btn ghost" data-act="steps" aria-expanded="${P.steps}">${P.steps ? 'Hide the steps' : 'See how to solve it'}</button><button class="btn primary" data-act="next">${o.next || 'Next problem'}</button></div>`;
    if (P.steps) h += `<div class="sol"><p class="tag">${c.ok ? 'Check your work against these steps' : 'How to solve it'}</p>${stepsHTML(p.steps)}</div>`;
  }
  return h + '</article>';
}
function streakLine(P) {
  if (P.src === 'mix') return 'Mixed practice: each problem comes from one of the four skills.';
  const st = saved.st[P.src];
  if (st && st.d) return `<b>${E.SKILLS[P.src].name}</b> is checked off ✓. Keep practicing, or pick another skill.`;
  const s = st ? Math.min(st.s, 2) : 0, name = `<b>${E.SKILLS[P.src].name}</b>`;
  if (s === 2) return `${name}: 2 in a row. One more right checks off this skill.`;
  return `${name}: ${s} in a row. Get 3 right in a row, without a hint, to check it off.`;
}
function practice(m) {
  const P = ensurePrac(m.n);
  let h = `<div class="chips" role="group" aria-label="Choose a skill">${m.skills.map(s => `<button class="chip" data-act="skill" data-skill="${s}" aria-pressed="${P.src === s}">${E.SKILLS[s].name}${dots(s)}</button>`).join('')}<button class="chip" data-act="skill" data-skill="mix" aria-pressed="${P.src === 'mix'}">Mix all four</button></div>
    <p class="streak" id="streak">${streakLine(P)}</p>
    <div id="card">${card(P, {})}</div>
    <p class="fine center">New numbers every time you press Next problem. Keys: A–D to pick, Enter to check.</p>`;
  const nx = MODS[m.n];
  h += `<div class="next-row"><span class="fine">${doneCount(m.skills)} of 4 skills checked off in this module.</span>${nx ? `<button class="btn ghost" data-act="go" data-go="${nx.n}">Next: Module ${nx.n}</button>` : '<button class="btn ghost" data-act="go" data-go="mix">Next: Mixed review</button>'}</div>`;
  return h;
}
function modulePage(n) {
  const m = MODS[n - 1], tab = S.tab[n] || 'learn';
  return `<header class="mod-head"><p class="eyebrow">Module ${m.n} · ${m.mins} minutes · ${m.at}</p><h1>${m.title}</h1><p class="why">${m.why}</p>
    <div class="seg" role="tablist"><button role="tab" data-act="tab" data-tab="learn" aria-selected="${tab === 'learn'}">Learn</button><button role="tab" data-act="tab" data-tab="practice" aria-selected="${tab === 'practice'}">Practice ${squares(m.skills)}</button></div></header>
    <div class="mod-body">${tab === 'learn' ? learn(m) : practice(m)}</div>`;
}

/* ---------- mixed review ---------- */
function startMix() {
  const pick2 = a => a.slice().sort(() => Math.random() - 0.5).slice(0, 2);
  let list = MODS.flatMap(m => pick2(m.skills));
  const rest = ALL.filter(s => !list.includes(s)).sort(() => Math.random() - 0.5).slice(0, 2);
  list = list.concat(rest).sort(() => Math.random() - 0.5);
  S.mix = { list, i: 0, res: [], P: { p: E.generate(list[0]), sel: null, done: false, hint: false, steps: false } };
}
function mixPage() {
  let h = '<header class="mod-head"><p class="eyebrow">Last 10 minutes</p><h1>Mixed review</h1>';
  if (!S.mix) return h + `<p class="why">Ten problems that jump between all four modules, the way the real test does. Each one still counts toward your skill streaks.</p></header><div class="next-row start"><button class="btn primary" data-act="mix-start">Start the mixed review</button></div>`;
  const X = S.mix;
  if (X.i >= X.list.length) {
    const right = X.res.filter(r => r.ok).length, missed = [...new Set(X.res.filter(r => !r.ok).map(r => r.sid))];
    h += `<p class="why">You got <b>${right} of ${X.list.length}</b>. ${missed.length ? 'Go back and practice the skills you missed.' : 'Every one right. Nice work.'}</p></header><ol class="results">${X.res.map((r, i) => `<li class="${r.ok ? 'ok' : 'no'}"><span class="rn">${i + 1}</span><span>${E.SKILLS[r.sid].name}</span><span class="rk">${r.ok ? '✓' : '✗'}</span></li>`).join('')}</ol>`;
    if (missed.length) h += `<div class="chips">${missed.map(s => `<button class="chip" data-act="drill" data-skill="${s}">Practice: ${E.SKILLS[s].name}</button>`).join('')}</div>`;
    return h + '<div class="next-row start"><button class="btn primary" data-act="mix-start">Try another set of ten</button></div>';
  }
  h += `<p class="why">Question <b>${X.i + 1}</b> of ${X.list.length} · ${X.res.filter(r => r.ok).length} right so far</p></header>`;
  return h + `<div id="card">${card(X.P, { label: `Module ${E.SKILLS[X.P.p.skill].mod} · ${E.SKILLS[X.P.p.skill].name}`, next: X.i === X.list.length - 1 ? 'See my results' : 'Next question' })}</div>`;
}

/* ---------- distribution arrows ---------- */
function drawArcs() {
  document.querySelectorAll('.dist').forEach(el => {
    el.querySelectorAll('svg.arcs').forEach(s => s.remove());
    const box = el.getBoundingClientRect(); if (!box.width) return;
    const A = el.querySelector('.d-a').getBoundingClientRect(), fs = parseFloat(getComputedStyle(el).fontSize), H = fs * 1.2;
    const ax = A.left + A.width / 2 - box.left; let paths = '';
    el.querySelectorAll('.d-t').forEach((t, i) => {
      const r = t.getBoundingClientRect(), tx = r.left + r.width / 2 - box.left, h = H * (0.62 + 0.38 * i), cx = (ax + tx) / 2, cy = H - h * 1.7;
      const y0 = H - fs * 0.05, ex = tx, ey = y0, dx = ex - cx, dy = ey - cy, len = Math.hypot(dx, dy), ux = dx / len, uy = dy / len, s = fs * 0.32;
      paths += `<path class="arc" d="M${(ax + 2).toFixed(1)} ${y0.toFixed(1)} Q ${cx.toFixed(1)} ${cy.toFixed(1)} ${ex.toFixed(1)} ${(ey - s * 0.6).toFixed(1)}"/>`;
      paths += `<path class="ah" d="M${ex.toFixed(1)} ${ey.toFixed(1)} L ${(ex - ux * s - uy * s * 0.55).toFixed(1)} ${(ey - uy * s + ux * s * 0.55).toFixed(1)} L ${(ex - ux * s + uy * s * 0.55).toFixed(1)} ${(ey - uy * s - ux * s * 0.55).toFixed(1)} Z"/>`;
    });
    el.insertAdjacentHTML('afterbegin', `<svg class="arcs" aria-hidden="true" width="${box.width.toFixed(0)}" height="${H.toFixed(0)}" style="top:${(-H).toFixed(0)}px">${paths}</svg>`);
  });
  drawWings();
}
function drawWings() {
  document.querySelectorAll('.bf').forEach(el => {
    el.querySelectorAll('svg.wings').forEach(s => s.remove());
    const box = el.getBoundingClientRect(); if (!box.width) return;
    const ctr = sel => { const r = el.querySelector(sel).getBoundingClientRect(); return [r.left + r.width / 2 - box.left, r.top + r.height / 2 - box.top, r.width, r.height]; };
    const A = ctr('.bf-a'), B = ctr('.bf-b'), C = ctr('.bf-c'), D = ctr('.bf-d');
    const seg = (P, Q, cls) => {
      const dx = Q[0] - P[0], dy = Q[1] - P[1], L = Math.hypot(dx, dy), ux = dx / L, uy = dy / L;
      const s1 = Math.min(P[2] / 2 / Math.abs(ux || 1e-6), P[3] / 2 / Math.abs(uy || 1e-6)) + 2, s2 = Math.min(Q[2] / 2 / Math.abs(ux || 1e-6), Q[3] / 2 / Math.abs(uy || 1e-6)) + 2;
      return `<line class="${cls}" x1="${(P[0] + ux * s1).toFixed(1)}" y1="${(P[1] + uy * s1).toFixed(1)}" x2="${(Q[0] - ux * s2).toFixed(1)}" y2="${(Q[1] - uy * s2).toFixed(1)}"/>`;
    };
    el.insertAdjacentHTML('afterbegin', `<svg class="wings" aria-hidden="true" width="${box.width.toFixed(0)}" height="${box.height.toFixed(0)}">${seg(A, D, 'w1')}${seg(B, C, 'w2')}</svg>`);
  });
}
let arcTimer; window.addEventListener('resize', () => { clearTimeout(arcTimer); arcTimer = setTimeout(drawArcs, 120); });
if (document.fonts && document.fonts.ready) document.fonts.ready.then(drawArcs);

/* ---------- render + events ---------- */
function render(scrollTop) {
  document.querySelectorAll('[data-nav]').forEach(b => b.setAttribute('aria-current', String(b.dataset.nav) === String(S.view) ? 'page' : 'false'));
  app.innerHTML = S.view === 'home' ? home() : S.view === 'mix' ? mixPage() : modulePage(+S.view);
  if (scrollTop) window.scrollTo(0, 0);
  drawArcs();
}
function current() {
  if (S.view === 'mix') return S.mix && S.mix.i < S.mix.list.length ? { P: S.mix.P, mix: true } : null;
  const n = +S.view; if (n && S.tab[n] === 'practice') return { P: S.prac[n], n };
  return null;
}
function refreshCard() {
  const c = current(); if (!c) return render();
  if (c.mix) { render(); return; }
  document.getElementById('card').innerHTML = card(c.P, {});
  const st = document.getElementById('streak'); if (st) st.innerHTML = streakLine(c.P);
  document.querySelectorAll('.chip[data-skill]').forEach(b => { const s = b.dataset.skill; if (s !== 'mix') b.innerHTML = E.SKILLS[s].name + dots(s); });
  const seg = document.querySelector('.seg [data-tab="practice"]'); if (seg) seg.innerHTML = 'Practice ' + squares(MODS[c.n - 1].skills);
  drawArcs();
}
function check() {
  const c = current(); if (!c || c.P.done || c.P.sel === null) return;
  const P = c.P, ok = P.p.choices[P.sel].ok, st = stat(P.p.skill);
  P.done = true; st.t++;
  if (ok) { st.r++; if (!P.hint) st.s++; P.steps = true; } else st.s = 0;
  if (st.s >= 3) st.d = true;
  save();
  if (c.mix) S.mix.res.push({ sid: P.p.skill, ok });
  if (c.mix) render(); else refreshCard();
  const fb = document.querySelector('.fb'); if (fb) fb.scrollIntoView({ block: 'nearest', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
}
function next() {
  const c = current(); if (!c) return;
  if (c.mix) { const X = S.mix; X.i++; if (X.i < X.list.length) X.P = { p: E.generate(X.list[X.i]), sel: null, done: false, hint: false, steps: false }; render(true); return; }
  newProblem(c.P, c.n); refreshCard();
  const card = document.getElementById('card'); if (card && card.getBoundingClientRect().top < 0) card.scrollIntoView({ block: 'start' });
}
function go(v) { S.view = v; S.arm = false; S.erased = false; render(true); }

document.addEventListener('click', e => {
  const b = e.target.closest('[data-act]'); if (!b || b.disabled) return;
  const a = b.dataset.act, c = current();
  if (a === 'go') return go(b.dataset.go);
  if (a === 'tab') { S.tab[+S.view] = b.dataset.tab; render(true); return; }
  if (a === 'skill') { const n = +S.view; S.prac[n].src = b.dataset.skill; newProblem(S.prac[n], n); document.querySelectorAll('.chip[data-skill]').forEach(x => x.setAttribute('aria-pressed', String(x.dataset.skill === b.dataset.skill))); refreshCard(); return; }
  if (a === 'drill') { const sid = b.dataset.skill, n = E.SKILLS[sid].mod; S.tab[n] = 'practice'; S.prac[n] = { src: sid }; go(String(n)); return; }
  if (a === 'pick' && c && !c.P.done) { c.P.sel = +b.dataset.i; c.mix ? render() : refreshCard(); return; }
  if (a === 'hint' && c) { c.P.hint = true; c.mix ? render() : refreshCard(); return; }
  if (a === 'check') return check();
  if (a === 'steps' && c) { c.P.steps = !c.P.steps; c.mix ? render() : refreshCard(); return; }
  if (a === 'next') return next();
  if (a === 'mix-start') { startMix(); render(true); return; }
  if (a === 'ex-next' || a === 'ex-all' || a === 'ex-reset') {
    const id = b.dataset.ex, [mi, vi, ei] = id.split('-').map(Number), ex = MODS[mi - 1].moves[vi].ex[ei];
    S.ex[id] = a === 'ex-reset' ? 0 : a === 'ex-all' ? ex.steps.length : Math.min((S.ex[id] || 0) + 1, ex.steps.length);
    const el = document.getElementById('ex-' + id); el.outerHTML = exampleHTML(id, ex); drawArcs();
    const btn = document.querySelector(`#ex-${id} .ex-ctrl .btn`); if (btn) btn.focus({ preventScroll: true });
    return;
  }
  if (a === 'reset') { S.arm = true; S.erased = false; render(); document.getElementById('reset').scrollIntoView({ block: 'center' }); return; }
  if (a === 'reset-no') { S.arm = false; render(); document.getElementById('reset').scrollIntoView({ block: 'center' }); return; }
  if (a === 'reset-yes') { saved.st = {}; save(); S.arm = false; S.erased = true; S.prac = {}; S.mix = null; S.ex = {}; render(); document.getElementById('reset').scrollIntoView({ block: 'center' }); return; }
  if (a === 'big') { saved.big = !saved.big; save(); applyBig(); }
});
document.addEventListener('input', e => {
  if (e.target.dataset.act !== 'shift') return;
  S.shift.h = +document.getElementById('sh-h').value; S.shift.k = +document.getElementById('sh-k').value;
  document.getElementById('sh-plot').innerHTML = shiftPlot();
  document.getElementById('sh-eq').innerHTML = Rm(shiftEq());
  document.getElementById('sh-hd').textContent = hDesc(S.shift.h); document.getElementById('sh-kd').textContent = kDesc(S.shift.k);
});
document.addEventListener('keydown', e => {
  if (e.ctrlKey || e.metaKey || e.altKey) return;
  const tag = (e.target.tagName || '').toLowerCase(); if (tag === 'input' || tag === 'textarea' || tag === 'select') return;
  const c = current(); if (!c) return;
  const k = e.key.toLowerCase(), idx = 'abcd'.indexOf(k) >= 0 ? 'abcd'.indexOf(k) : '1234'.indexOf(k);
  if (idx >= 0 && !c.P.done) { c.P.sel = idx; c.mix ? render() : refreshCard(); e.preventDefault(); return; }
  if (k === 'enter' && !(tag === 'button' && e.target.closest('#card'))) { if (c.P.done) next(); else if (c.P.sel !== null) check(); else return; e.preventDefault(); }
});
function applyBig() { document.documentElement.classList.toggle('big', !!saved.big); const b = document.getElementById('bigBtn'); if (b) b.setAttribute('aria-pressed', String(!!saved.big)); }
applyBig();
render();
})();

</script>

</body>
</html>
